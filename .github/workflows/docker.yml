name: Validate fork container on demand
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    needs: []
    steps:
    - uses: actions/checkout@v7
    - name: Build and validate the documented fork container
      run: |
        docker build --build-arg TARGETARCH=amd64 -t preset-container-test .
        docker run -d --name preset-container-test --network host -e XUI_ENABLE_FAIL2BAN=false -e XUI_PRESET_REALITY_SERVER_NAME=www.samsung.com preset-container-test
        for i in $(seq 1 30); do
          if docker exec preset-container-test test -f /etc/x-ui/preset-result.json; then break; fi
          sleep 1
        done
        docker exec preset-container-test /app/x-ui -v | grep -Fx 3.10.2-preset
        docker exec preset-container-test /app/bin/xray-linux-amd64 version | grep -F 'Xray 26.6.27'
        docker exec preset-container-test test -s /etc/x-ui/preset-result.json
        docker rm -f preset-container-test
