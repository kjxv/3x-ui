name: Maintain default node preset
'on':
  push:
    branches:
    - codex/v3.6.0-preset
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Build unchanged frontend
      run: npm ci && npm run build
      working-directory: frontend
    - uses: actions/upload-artifact@v7
      with:
        name: preset-frontend
        path: internal/web/dist
  verify:
    runs-on: ubuntu-latest
    needs:
    - frontend
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - uses: actions/download-artifact@v8
      with:
        name: preset-frontend
        path: internal/web/dist
    - name: Download pinned runtime for validation
      run: |-
        python3 deploy/preset/package.py --platform linux-amd64 --runtime-only
        echo "XUI_BIN_FOLDER=$GITHUB_WORKSPACE/x-ui/bin" >> "$GITHUB_ENV"
        echo "XRAY_LOCATION_ASSET=$GITHUB_WORKSPACE/x-ui/bin" >> "$GITHUB_ENV"
    - name: Check formatting and installer syntax
      run: |
        test -z "$(gofmt -l main.go internal/config/config.go internal/web/service/tutorial_preset*.go internal/web/service/panel/preset_test.go internal/web/service/panel/panel.go)"
        for script in install.sh x-ui.sh update.sh deploy/preset/*.sh; do bash -n "$script" || exit; done
        python3 -m unittest discover -s deploy/preset -p '*_test.py'
    - name: Test transactional initialization, routes, subscriptions and update guard
      run: |-
        go test ./internal/web/service -run 'TutorialPreset|InboundTag|GetXrayConfig' -count=1
        go test ./internal/sub -run 'Clash|Sub.*Sort' -count=1
        go test ./internal/web/service/panel -count=1
    - name: Verify unchanged maintenance version
      run: test "$PRESET_RELEASE_TAG" = "v$(cat internal/config/version)"
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
        - amd64
        - arm64
        - armv7
        - armv6
        - 386
        - armv5
        - s390x
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        check-latest: true
    - name: Download frontend bundle
      uses: actions/download-artifact@v8
      with:
        name: preset-frontend
        path: internal/web/dist
    - name: Build 3X-UI
      run: |
        CURL_RETRY="--retry 5 --retry-all-errors --retry-delay 3"
        fetch() { wget -q --tries=5 --waitretry=10 --retry-on-http-error=429,500,502,503 "$@"; }
        export CGO_ENABLED=1
        export GOOS=linux
        export GOARCH=${{ matrix.platform }}
        # Use Bootlin prebuilt cross-toolchains (musl 1.2.5 in stable series)
        case "${{ matrix.platform }}" in
          amd64) BOOTLIN_ARCH="x86-64" ;;
          arm64) BOOTLIN_ARCH="aarch64" ;;
          armv7) BOOTLIN_ARCH="armv7-eabihf"; export GOARCH=arm GOARM=7 ;;
          armv6) BOOTLIN_ARCH="armv6-eabihf"; export GOARCH=arm GOARM=6 ;;
          armv5) BOOTLIN_ARCH="armv5-eabi"; export GOARCH=arm GOARM=5 ;;
          386) BOOTLIN_ARCH="x86-i686" ;;
          s390x) BOOTLIN_ARCH="s390x-z13" ;;
        esac
        echo "Resolving Bootlin musl toolchain for arch=$BOOTLIN_ARCH (platform=${{ matrix.platform }})"
        TARBALL_BASE="https://toolchains.bootlin.com/downloads/releases/toolchains/$BOOTLIN_ARCH/tarballs/"
        TARBALL_URL=$(curl -fsSL $CURL_RETRY "$TARBALL_BASE" | grep -oE "${BOOTLIN_ARCH}--musl--stable-[^\"]+\\.tar\\.xz" | sort -r | head -n1)
        [ -z "$TARBALL_URL" ] && { echo "Failed to locate Bootlin musl toolchain for arch=$BOOTLIN_ARCH" >&2; exit 1; }
        echo "Downloading: $TARBALL_URL"
        cd /tmp
        curl -fL -sS $CURL_RETRY -o "$(basename "$TARBALL_URL")" "$TARBALL_BASE/$TARBALL_URL"
        tar -xf "$(basename "$TARBALL_URL")"
        TOOLCHAIN_DIR=$(find . -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*" | head -n1)
        export PATH="$(realpath "$TOOLCHAIN_DIR")/bin:$PATH"
        export CC=$(realpath "$(find "$TOOLCHAIN_DIR/bin" -name '*-gcc.br_real' -type f -executable | head -n1)")
        [ -z "$CC" ] && { echo "No gcc.br_real found in $TOOLCHAIN_DIR/bin" >&2; exit 1; }
        cd -
        # Stamp the commit into per-commit (dev channel) builds only; tagged
        # stable releases stay unstamped so config.IsDevBuild() returns false.
        LDFLAGS="-w -s -linkmode external -extldflags '-static'"
        go build -ldflags "$LDFLAGS" -o xui-release -v main.go
        file xui-release
        ldd xui-release || echo "Static binary confirmed"
    - name: Reuse frozen v3.6.0 runtime assets
      run: python3 deploy/preset/package.py --platform linux-${{ matrix.platform }} --binary xui-release
    - name: Smoke test actual Xray and subscription
      if: matrix.platform == 'amd64'
      run: python3 deploy/preset/smoke_test.py --directory x-ui
    - name: Upload files to Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: x-ui-linux-${{ matrix.platform }}
        path: ./x-ui-linux-${{ matrix.platform }}.tar.gz
    needs:
    - frontend
    - verify
  build-windows:
    name: Build for Windows
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
        - amd64
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        check-latest: true
    - name: Download frontend bundle
      uses: actions/download-artifact@v8
      with:
        name: preset-frontend
        path: internal/web/dist
    - name: Install MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-sqlite3 mingw-w64-x86_64-pkg-config
    - name: Build 3X-UI for Windows (CGO)
      shell: msys2 {0}
      run: |
        export PATH="/c/hostedtoolcache/windows/go/$(ls /c/hostedtoolcache/windows/go | sort -V | tail -n1)/x64/bin:$PATH"

        export CGO_ENABLED=1
        export GOOS=windows
        export GOARCH=amd64
        export CC=x86_64-w64-mingw32-gcc

        which go
        go version
        gcc --version

        # Stamp the commit into per-commit (dev channel) builds only.
        LDFLAGS="-w -s"
        go build -ldflags "$LDFLAGS" -o xui-release.exe -v main.go
    - name: Copy and download resources
      shell: pwsh
      run: python deploy/preset/package.py --platform windows-amd64 --binary xui-release.exe
    - name: Upload files to Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: x-ui-windows-amd64
        path: ./x-ui-windows-amd64.zip
    needs:
    - frontend
    - verify
  publish:
    runs-on: ubuntu-latest
    needs:
    - build
    - build-windows
    - verify
    - installer-test
    if: github.ref == 'refs/heads/codex/v3.6.0-preset'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        pattern: x-ui-*
        path: packages
        merge-multiple: true
    - name: Update the same preset tag and release after all checks pass
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash deploy/preset/publish.sh packages
  installer-test:
    runs-on: ubuntu-latest
    needs:
    - build
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: x-ui-linux-amd64
        path: packages
    - name: Prepare package checksums
      run: |-
        cd packages
        sha256sum *.tar.gz > checksums.txt
    - name: Verify full installation, failed-first-install recovery and preserved edits
      run: bash deploy/preset/installer_test.sh packages
    - name: Reproduce ACME directory regression and verify fresh HTTPS panel and subscription
      run: bash deploy/preset/tls_installer_test.sh packages
  published-install:
    if: needs.publish.result == 'success'
    needs:
    - publish
    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-latest
        - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Verify downloads and panel startup from published fixed release
      run: bash deploy/test/smoke-noninteractive.sh "$PRESET_RELEASE_TAG"
concurrency:
  group: maintain-v3.6.0-preset
  cancel-in-progress: false
env:
  PRESET_RELEASE_TAG: v3.6.0-preset.4
