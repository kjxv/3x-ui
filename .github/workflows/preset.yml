name: Build fixed node preset
'on':
  push:
    branches:
    - codex/v3.6.0-preset
    tags:
    - v*-preset.*
    paths-ignore:
    - .github/workflows/preset.yml
    - deploy/preset/installer_test.sh
    - deploy/preset/*_test.py
    - .github/workflows/docker.yml
  workflow_dispatch:
    inputs:
      artifact-run:
        description: Existing build run to validate installer only (blank builds all
          packages)
        required: false
        default: ''
        type: string
      release-tag:
        description: Publish already verified artifacts to their original preset tag
          (requires artifact-run)
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Build unchanged frontend
      run: npm ci && npm run build
      working-directory: frontend
    - uses: actions/upload-artifact@v7
      with:
        name: preset-frontend
        path: internal/web/dist
    if: github.event_name != 'workflow_dispatch' || inputs.artifact-run == ''
  verify:
    runs-on: ubuntu-latest
    needs:
    - frontend
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - uses: actions/download-artifact@v8
      with:
        name: preset-frontend
        path: internal/web/dist
    - name: Download pinned runtime for validation
      run: 'python3 deploy/preset/package.py --platform linux-amd64 --runtime-only

        echo "XUI_BIN_FOLDER=$GITHUB_WORKSPACE/x-ui/bin" >> "$GITHUB_ENV"

        echo "XRAY_LOCATION_ASSET=$GITHUB_WORKSPACE/x-ui/bin" >> "$GITHUB_ENV"'
    - name: Check formatting and installer syntax
      run: 'test -z "$(gofmt -l main.go internal/config/config.go internal/web/service/tutorial_preset*.go
        internal/web/service/panel/preset_test.go internal/web/service/panel/panel.go)"

        bash -n install.sh x-ui.sh update.sh deploy/preset/install.sh

        python3 -m unittest discover -s deploy/preset -p ''*_test.py'''
    - name: Test transactional initialization, routes, subscriptions and update guard
      run: 'go test ./internal/web/service -run ''TutorialPreset|InboundTag|GetXrayConfig''
        -count=1

        go test ./internal/sub -run ''Clash|Sub.*Sort'' -count=1

        go test ./internal/web/service/panel -count=1'
    - name: Verify fixed release tag
      if: startsWith(github.ref, 'refs/tags/')
      run: test "$GITHUB_REF_NAME" = "v$(cat internal/config/version)"
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
        - amd64
        - arm64
        - armv7
        - armv6
        - 386
        - armv5
        - s390x
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        check-latest: true
    - name: Download frontend bundle
      uses: actions/download-artifact@v8
      with:
        name: preset-frontend
        path: internal/web/dist
    - name: Build 3X-UI
      run: "CURL_RETRY=\"--retry 5 --retry-all-errors --retry-delay 3\"\nfetch() {\
        \ wget -q --tries=5 --waitretry=10 --retry-on-http-error=429,500,502,503 \"\
        $@\"; }\nexport CGO_ENABLED=1\nexport GOOS=linux\nexport GOARCH=${{ matrix.platform\
        \ }}\n# Use Bootlin prebuilt cross-toolchains (musl 1.2.5 in stable series)\n\
        case \"${{ matrix.platform }}\" in\n  amd64) BOOTLIN_ARCH=\"x86-64\" ;;\n\
        \  arm64) BOOTLIN_ARCH=\"aarch64\" ;;\n  armv7) BOOTLIN_ARCH=\"armv7-eabihf\"\
        ; export GOARCH=arm GOARM=7 ;;\n  armv6) BOOTLIN_ARCH=\"armv6-eabihf\"; export\
        \ GOARCH=arm GOARM=6 ;;\n  armv5) BOOTLIN_ARCH=\"armv5-eabi\"; export GOARCH=arm\
        \ GOARM=5 ;;\n  386) BOOTLIN_ARCH=\"x86-i686\" ;;\n  s390x) BOOTLIN_ARCH=\"\
        s390x-z13\" ;;\nesac\necho \"Resolving Bootlin musl toolchain for arch=$BOOTLIN_ARCH\
        \ (platform=${{ matrix.platform }})\"\nTARBALL_BASE=\"https://toolchains.bootlin.com/downloads/releases/toolchains/$BOOTLIN_ARCH/tarballs/\"\
        \nTARBALL_URL=$(curl -fsSL $CURL_RETRY \"$TARBALL_BASE\" | grep -oE \"${BOOTLIN_ARCH}--musl--stable-[^\\\
        \"]+\\\\.tar\\\\.xz\" | sort -r | head -n1)\n[ -z \"$TARBALL_URL\" ] && {\
        \ echo \"Failed to locate Bootlin musl toolchain for arch=$BOOTLIN_ARCH\"\
        \ >&2; exit 1; }\necho \"Downloading: $TARBALL_URL\"\ncd /tmp\ncurl -fL -sS\
        \ $CURL_RETRY -o \"$(basename \"$TARBALL_URL\")\" \"$TARBALL_BASE/$TARBALL_URL\"\
        \ntar -xf \"$(basename \"$TARBALL_URL\")\"\nTOOLCHAIN_DIR=$(find . -maxdepth\
        \ 1 -type d -name \"${BOOTLIN_ARCH}--musl--stable-*\" | head -n1)\nexport\
        \ PATH=\"$(realpath \"$TOOLCHAIN_DIR\")/bin:$PATH\"\nexport CC=$(realpath\
        \ \"$(find \"$TOOLCHAIN_DIR/bin\" -name '*-gcc.br_real' -type f -executable\
        \ | head -n1)\")\n[ -z \"$CC\" ] && { echo \"No gcc.br_real found in $TOOLCHAIN_DIR/bin\"\
        \ >&2; exit 1; }\ncd -\n# Stamp the commit into per-commit (dev channel) builds\
        \ only; tagged\n# stable releases stay unstamped so config.IsDevBuild() returns\
        \ false.\nLDFLAGS=\"-w -s -linkmode external -extldflags '-static'\"\ngo build\
        \ -ldflags \"$LDFLAGS\" -o xui-release -v main.go\nfile xui-release\nldd xui-release\
        \ || echo \"Static binary confirmed\"\n"
    - name: Reuse frozen v3.6.0 runtime assets
      run: python3 deploy/preset/package.py --platform linux-${{ matrix.platform }}
        --binary xui-release
    - name: Smoke test actual Xray and subscription
      if: matrix.platform == 'amd64'
      run: python3 deploy/preset/smoke_test.py --directory x-ui
    - name: Upload files to Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: x-ui-linux-${{ matrix.platform }}
        path: ./x-ui-linux-${{ matrix.platform }}.tar.gz
    needs:
    - frontend
    - verify
  build-windows:
    name: Build for Windows
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
        - amd64
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        check-latest: true
    - name: Download frontend bundle
      uses: actions/download-artifact@v8
      with:
        name: preset-frontend
        path: internal/web/dist
    - name: Install MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-sqlite3 mingw-w64-x86_64-pkg-config
    - name: Build 3X-UI for Windows (CGO)
      shell: msys2 {0}
      run: 'export PATH="/c/hostedtoolcache/windows/go/$(ls /c/hostedtoolcache/windows/go
        | sort -V | tail -n1)/x64/bin:$PATH"


        export CGO_ENABLED=1

        export GOOS=windows

        export GOARCH=amd64

        export CC=x86_64-w64-mingw32-gcc


        which go

        go version

        gcc --version


        # Stamp the commit into per-commit (dev channel) builds only.

        LDFLAGS="-w -s"

        go build -ldflags "$LDFLAGS" -o xui-release.exe -v main.go

        '
    - name: Copy and download resources
      shell: pwsh
      run: python deploy/preset/package.py --platform windows-amd64 --binary xui-release.exe
    - name: Upload files to Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: x-ui-windows-amd64
        path: ./x-ui-windows-amd64.zip
    needs:
    - frontend
    - verify
  publish:
    runs-on: ubuntu-latest
    needs:
    - build
    - build-windows
    - verify
    - installer-test
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        pattern: x-ui-*
        path: packages
        merge-multiple: true
    - name: Publish new preset release without changing old releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PRESET_RELEASE_TAG: ${{ github.ref_name }}
      run: 'set -euo pipefail

        cd packages

        sha256sum *.tar.gz *.zip > checksums.txt

        test "$(find . -maxdepth 1 -name ''x-ui-*'' -type f | wc -l)" -eq 8

        cd ..

        gh release create "$PRESET_RELEASE_TAG" --verify-tag --draft --title "3X-UI
        $PRESET_RELEASE_TAG 默认节点预设版" --notes-file deploy/preset/release-notes.md

        gh release upload "$PRESET_RELEASE_TAG" packages/* install.sh x-ui.sh deploy/preset/README.md

        gh release edit "$PRESET_RELEASE_TAG" --draft=false --prerelease=false --latest=false

        '
  installer-test:
    runs-on: ubuntu-latest
    needs:
    - build
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.release-tag || github.sha }}
    - uses: actions/download-artifact@v8
      with:
        name: x-ui-linux-amd64
        path: packages
        run-id: ${{ inputs.artifact-run || github.run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Prepare package checksums
      run: 'cd packages

        sha256sum *.tar.gz > checksums.txt'
    - name: Verify full installation, failed-first-install recovery and preserved
        edits
      run: bash deploy/preset/installer_test.sh packages
    if: always() && !cancelled() && (needs.build.result == 'success' || (github.event_name
      == 'workflow_dispatch' && inputs.artifact-run != ''))
  published-install:
    if: always() && (needs.publish.result == 'success' || needs.recover-publish.result
      == 'success')
    needs:
    - publish
    - recover-publish
    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-latest
        - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.release-tag || github.sha }}
    - name: Verify downloads and panel startup from published fixed release
      run: bash deploy/test/smoke-noninteractive.sh "$PRESET_RELEASE_TAG"
      env:
        PRESET_RELEASE_TAG: ${{ inputs.release-tag || github.ref_name }}
  recover-publish:
    runs-on: ubuntu-latest
    needs:
    - installer-test
    if: github.event_name == 'workflow_dispatch' && inputs.artifact-run != '' && inputs.release-tag
      != ''
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.release-tag }}
    - name: Verify packages were built and tested from this exact immutable tag
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PRESET_RELEASE_TAG: ${{ inputs.release-tag }}
        ARTIFACT_RUN: ${{ inputs.artifact-run }}
      run: 'set -euo pipefail

        [[ "$ARTIFACT_RUN" =~ ^[0-9]+$ ]]

        [[ "$PRESET_RELEASE_TAG" == v*-preset.* ]]

        test "$PRESET_RELEASE_TAG" = "v$(cat internal/config/version)"

        built_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN" --jq
        .head_sha)

        test "$built_sha" = "$(git rev-parse HEAD)"

        gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN/jobs?per_page=100"
        > "$RUNNER_TEMP/preset-verified-jobs.json"

        python3 - "$RUNNER_TEMP/preset-verified-jobs.json" <<''PY''

        import json,sys

        jobs={job[''name'']:job[''conclusion''] for job in json.load(open(sys.argv[1]))[''jobs'']}

        required=[''frontend'',''verify'',''Build for Windows (amd64)'']+[f''build
        ({arch})'' for arch in [''amd64'',''arm64'',''armv7'',''armv6'',''armv5'',''386'',''s390x'']]

        assert all(jobs.get(name)==''success'' for name in required), ''Required source
        checks or platform builds did not pass''

        print(''Verified all eight packages and source tests belong to this exact
        release tag.'')

        PY'
    - uses: actions/download-artifact@v8
      with:
        pattern: x-ui-*
        path: packages
        merge-multiple: true
        run-id: ${{ inputs.artifact-run }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish new preset release without changing old releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PRESET_RELEASE_TAG: ${{ inputs.release-tag }}
      run: 'set -euo pipefail

        cd packages

        sha256sum *.tar.gz *.zip > checksums.txt

        test "$(find . -maxdepth 1 -name ''x-ui-*'' -type f | wc -l)" -eq 8

        cd ..

        gh release create "$PRESET_RELEASE_TAG" --verify-tag --draft --title "3X-UI
        $PRESET_RELEASE_TAG 默认节点预设版" --notes-file deploy/preset/release-notes.md

        gh release upload "$PRESET_RELEASE_TAG" packages/* install.sh x-ui.sh deploy/preset/README.md

        gh release edit "$PRESET_RELEASE_TAG" --draft=false --prerelease=false --latest=false

        '
